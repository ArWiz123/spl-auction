<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPL Season 5 — Auction Login</title>
<style>
:root{--gold:#facc15;--muted:#94a3b8;--border:#29435f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#123052,#06111f 52%,#020711);color:#f8fafc;font:16px Arial,sans-serif}
.login-card{width:min(440px,100%);padding:34px;background:rgba(13,27,46,.98);border:1px solid #3b5874;border-top:4px solid var(--gold);border-radius:18px;box-shadow:0 24px 70px #0009}
.login-logo{display:block;width:86px;height:86px;object-fit:contain;margin:0 auto 12px}
.kicker{text-align:center;color:var(--gold);font-weight:900;letter-spacing:.18em;margin:0 0 8px}
h1{text-align:center;font-size:30px;margin:0}
.subtitle{text-align:center;color:var(--muted);margin:8px 0 24px}
label{display:block;color:#dbeafe;font-size:14px;font-weight:700;margin:14px 0 6px}
input{display:block;width:100%;padding:13px;background:#040d18;border:1px solid #3a5874;border-radius:7px;color:white;font:inherit}
input:focus{outline:2px solid var(--gold);outline-offset:2px}
.error{min-height:20px;margin:10px 0 0;color:#fca5a5;font-weight:700}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;background:var(--gold);color:#111827;font-size:16px;font-weight:900;cursor:pointer}
button:hover{filter:brightness(1.08)}
@media(max-width:480px){.login-card{padding:24px}}
</style>
</head>
<body>
<form class="login-card" id="loginForm">
  <img src="spl-logo.jpeg" alt="SPL logo" class="login-logo" onerror="this.style.display='none'">
  <p class="kicker">SPL SEASON 5</p>
  <h1>Auction Login</h1>
  <p class="subtitle">Sign in to open the live cricket auction.</p>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <p class="error" id="error" role="alert" aria-live="polite"></p>
  <button type="submit">ENTER AUCTION</button>
</form>
<script>
// Front-end credentials are visible in the published page source.
const LOGIN_USERNAME="admin";
const LOGIN_PASSWORD="Password@123";
const LOGIN_SESSION_KEY="splAuctionAuthenticated";

document.getElementById("loginForm").addEventListener("submit",event=>{
  event.preventDefault();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  if(username===LOGIN_USERNAME && password===LOGIN_PASSWORD){
    sessionStorage.setItem(LOGIN_SESSION_KEY,"true");
    window.location.replace("index.html");
  }else{
    document.getElementById("error").textContent="Username or password is incorrect.";
    document.getElementById("password").value="";
    document.getElementById("password").focus();
  }
});
</script>
</body>
</html>
